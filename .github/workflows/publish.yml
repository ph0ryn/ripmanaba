name: Publish Package

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          registry-url: "https://registry.npmjs.org"
          node-version: "24"
          cache: true
          run-install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.13

      - run: vp install --frozen-lockfile
      - run: vp run verify
      - run: vp pm publish --provenance --no-git-checks --access public
